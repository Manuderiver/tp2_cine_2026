<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cine Aurora 📽️ - Registro</title>
    <meta name="description" content="Cine Aurora - Registro" />

    <link rel="icon" href="../assets/favicon/logo-cine.png" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header>
      <div>
        <h1>Cine Aurora</h1>
        <img src="../assets/favicon/logo-cine.png" alt="logo cine aurora" />
      </div>

      <nav>
        <a href="../index.html">Inicio</a>
        <a href="./estrenos.html">Próximos estrenos</a>
        <a href="../index.html">Volver</a>
      </nav>
    </header>

    <main class="login-container">

      <form class="login-form" action="./login.html">

        <h2>Crear nueva cuenta</h2>

        <div>
          <label for="nombre">Nombre completo</label>
          <input id="nombre" type="text" required />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>

        <div>
          <label for="fecha">Fecha de nacimiento</label>
          <input id="fecha" type="date" required />
        </div>

        <div>
          <label for="password">Contraseña</label>
          <input id="password" type="password" required />
        </div>

        <div>
          <label for="confirm">Confirmar contraseña</label>
          <input id="confirm" type="password" required />
        </div>

        <hr />

        <div>
          <h3>Datos adicionales</h3>
          <p>Estos datos nos ayudan a mejorar tu experiencia.</p>
        </div>

        <div>
          <label>Color favorito para las butacas</label>
          <input type="color" />
        </div>

        <div>
          <label>¿Cuántas entradas comprás en general?</label>
          <input type="range" min="0" max="10" />
        </div>

        <div>
          <label>Seleccioná tu género favorito</label>
          <select>
            <option>Acción</option>
            <option>Drama</option>
            <option>Ciencia ficción</option>
            <option>Terror</option>
            <option>Comedia</option>
            <option>Romance</option>
          </select>
        </div>

        <div>
          <label>Snack favorito</label>

          <div>
            <input type="radio" name="snack" id="dulce" />
            <label for="dulce">Pochoclo dulce</label>
          </div>

          <div>
            <input type="radio" name="snack" id="salado" />
            <label for="salado">Pochoclo salado</label>
          </div>

          <div>
            <input type="radio" name="snack" id="chocolate" />
            <label for="chocolate">Chocolate</label>
          </div>

          <div>
            <input type="radio" name="snack" id="frutos" />
            <label for="frutos">Frutos secos</label>
          </div>
        </div>

        <button type="submit">Registrarse</button>

        <p>
          ¿Ya tenés cuenta?
          <a href="./login.html">Iniciar sesión</a>
        </p>

      </form>

    </main>

    <footer>
      <p>&copy; 2026 Cine Aurora - Todos los derechos reservados</p>
    </footer>
  </body>
</html>
